name: Feature request
description: An idea that would make Muted better for you.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or the annoyance, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: setup
    attributes:
      label: Your setup
      description: Optional. Headset or speakers, call app, game.
