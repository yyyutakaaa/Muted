name: Pages

# The website moved to https://muted.mehdioul.dev (repository yyyutakaaa/muted-site).
# GitHub Pages only publishes a page that sends old links there.
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Write the redirect page
        run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Muted has moved</title>
            <meta http-equiv="refresh" content="0; url=https://muted.mehdioul.dev/">
            <link rel="canonical" href="https://muted.mehdioul.dev/">
            <meta name="robots" content="noindex">
          </head>
          <body>
            <p>The Muted website has moved to <a href="https://muted.mehdioul.dev/">muted.mehdioul.dev</a>.</p>
          </body>
          </html>
          HTML
          cp site/index.html site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
