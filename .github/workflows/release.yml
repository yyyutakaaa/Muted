name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Lets a release be cut from the Actions tab when pushing a tag is not an
  # option. The tag is created here, from whatever this workflow checked out.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.4.0 or 0.4.0-beta1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Optional. The winget step skips itself when this is unset, so a fork or a
      # fresh clone still releases exactly as before.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Validate tag and derive version
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'.Trim()
          }
          else {
            '${{ github.ref_name }}'
          }
          if (-not $tag.StartsWith('v')) {
            $tag = "v$tag"
          }

          if ($tag.Substring(1) -match '^(\d+\.\d+\.\d+)(-[0-9A-Za-z][0-9A-Za-z.]*)?$') {
            # Assembly and installer versions stay strictly numeric; the suffix only
            # marks the release as a prerelease for the beta update channel.
            $prerelease = if ($Matches.Count -gt 2) { 'true' } else { 'false' }
            "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
            "VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append
            "PRERELEASE=$prerelease" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          else {
            throw "Release versions must look like v1.2.3 or v1.2.3-beta1."
          }

      - name: Check the version is unused
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if (git ls-remote --tags origin "refs/tags/$env:TAG") {
            throw "$env:TAG already exists. Pick a version that has not been released."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build, test, and package
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version $env:VERSION -InformationalVersion $env:TAG.Substring(1)

      # Only once the installer exists, so a failed build never leaves a tag
      # behind that blocks a retry with the same version.
      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $env:TAG -m "Muted $env:VERSION"
          git push origin $env:TAG
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push $env:TAG."
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @(
            'release', 'create', $env:TAG,
            "artifacts/Muted-Setup-$env:VERSION.exe",
            "artifacts/Muted-Setup-$env:VERSION.exe.sha256",
            "artifacts/Muted-win-x64.zip",
            '--verify-tag',
            '--generate-notes',
            '--title', "Muted $env:VERSION"
          )
          if ($env:PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }

          # Put this version's CHANGELOG.md section above the generated notes. A tag
          # without a section, like a quick beta, still releases with generated notes.
          $heading = '## [' + $env:TAG.Substring(1) + ']'
          $section = @()
          $inSection = $false
          if (Test-Path -LiteralPath CHANGELOG.md) {
            foreach ($line in Get-Content -LiteralPath CHANGELOG.md -Encoding utf8) {
              if ($line.StartsWith('## [') -or $line -match '^\[[^\]]+\]: ') {
                if ($inSection) { break }
                $inSection = $line.StartsWith($heading)
                continue
              }
              if ($inSection) { $section += $line }
            }
          }
          $notes = ($section -join "`n").Trim()

          if ($notes) {
            [IO.File]::WriteAllText("$env:RUNNER_TEMP/release-notes.md", "$notes`n")
            $arguments += @('--notes-file', "$env:RUNNER_TEMP/release-notes.md")
          }
          else {
            Write-Host "CHANGELOG.md has no section for $env:TAG; using generated notes only."
          }

          gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE."
          }

      # winget only takes stable versions. wingetcreate opens the pull request on
      # microsoft/winget-pkgs; it needs a classic token with public_repo scope in the
      # WINGET_TOKEN secret, and the package must have been submitted once by hand
      # (see packaging/winget/README.md).
      - name: Submit the new version to winget
        if: env.PRERELEASE == 'false' && env.WINGET_TOKEN != ''
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/Muted-Setup-$env:VERSION.exe"
          .\wingetcreate.exe update yyyutakaaa.Muted --version $env:VERSION --urls $url --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) {
            throw "wingetcreate failed with exit code $LASTEXITCODE."
          }

      # The repository doubles as a Scoop bucket. Point its manifest at the new zip.
      - name: Update the Scoop manifest
        if: env.PRERELEASE == 'false'
        continue-on-error: true
        shell: pwsh
        run: |
          $defaultBranch = '${{ github.event.repository.default_branch }}'
          git fetch origin $defaultBranch
          git checkout -B scoop-update "origin/$defaultBranch"
          $hash = (Get-FileHash -LiteralPath artifacts/Muted-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $path = 'bucket/muted.json'
          $manifest = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          $manifest.version = $env:VERSION
          $manifest.architecture.'64bit'.url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/Muted-win-x64.zip"
          $manifest.architecture.'64bit'.hash = $hash
          ($manifest | ConvertTo-Json -Depth 10) + "`n" | Set-Content -LiteralPath $path -NoNewline -Encoding utf8NoBOM
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $path
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Scoop manifest already up to date.'
            exit 0
          }
          git commit -m "Update Scoop manifest to $env:VERSION"
          git push origin "HEAD:$defaultBranch"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not push the Scoop manifest to $defaultBranch."
          }
